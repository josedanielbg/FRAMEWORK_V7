[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-v7"
version = "0.1.0"
description = "Framework multicapa para gestion hidrica del Rio Bogota."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
where = ["src"]
